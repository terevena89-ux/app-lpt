<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>LPT</title>
  <meta name="description" content="Mon recueil de trucs et astuces, avec une astuce du jour.">
  <!-- Couleur de la barre du téléphone (mise à jour par le script ci-dessous) -->
  <meta name="theme-color" content="#FBF8F2">
  <script>
    // Thème choisi sur cet appareil (Réglages → Thème) : auto, clair ou sombre.
    // On l'applique AVANT l'affichage de la page, pour éviter un « flash » blanc.
    // En « auto », on suit le réglage du téléphone/PC, même s'il change pendant qu'on utilise l'appli.
    // Même chose pour le style (Réglages → Style) : « journal » (par défaut) ou « pioche ».
    (function () {
      var choix = "auto", style = "journal";
      try {
        var r = JSON.parse(localStorage.getItem("lpt-reglages")) || {};
        choix = r.theme || "auto"; style = r.style || "journal";
      } catch (e) {}
      document.documentElement.dataset.style = style;
      var sombreTel = matchMedia("(prefers-color-scheme: dark)");
      function appliquer() {
        var theme = choix === "auto" ? (sombreTel.matches ? "sombre" : "clair") : choix;
        var journal = document.documentElement.dataset.style === "journal";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "sombre" ? (journal ? "#121318" : "#171c24") : (journal ? "#FFFFFF" : "#FBF8F2");
      }
      window.appliquerStyle = function (nouveau) { document.documentElement.dataset.style = nouveau; appliquer(); };
      appliquer();
      sombreTel.addEventListener("change", appliquer);
      window.appliquerTheme = function (nouveau) { choix = nouveau; appliquer(); };
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&family=Inter+Tight:ital,wght@0,500;0,700;0,800;0,900;1,900&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Les icônes viennent de la planche icones/icones.svg :
     <svg class="ic"><use href="icones/icones.svg#nom"></use></svg> -->

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<section id="ecran-connexion" class="ecran" hidden>
  <div class="connexion">
    <img src="icones/icone.svg" alt="" width="72" height="72">
    <h1>LPT</h1>
    <button id="btn-connexion" class="btn plein">Se connecter avec Google</button>
    <p id="connexion-erreur" class="erreur" hidden></p>
  </div>
</section>

<!-- ============ ÉCRAN PRINCIPAL : astuce du jour + recueil ============ -->
<section id="ecran-accueil" class="ecran" hidden>
  <header class="barre">
    <div class="titres"><h1 class="logo">LPT</h1><div class="sous-titre" id="date-du-jour"></div></div>
    <button class="btn-icone" id="btn-ajouter" aria-label="Ajouter une astuce"><svg class="ic"><use href="icones/icones.svg#plus"></use></svg></button>
    <button class="btn-icone" data-aller="reglages" aria-label="Réglages"><svg class="ic"><use href="icones/icones.svg#settings"></use></svg></button>
  </header>
  <div id="du-jour"></div>
  <div class="recherche">
    <svg class="ic"><use href="icones/icones.svg#search"></use></svg>
    <input id="recherche" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher">
  </div>
  <div id="filtres" class="filtres"></div>
  <!-- Titre de la section ouverte (style Journal seulement) : « Tout », « Favoris », « Cuisine »… -->
  <div id="titre-section" class="titre-section"></div>
  <div id="liste" class="liste"></div>
</section>

<!-- ============ RÉGLAGES ============ -->
<!-- Réglages, Thème et Catégories : petites fenêtres au centre, posées sur l'écran principal
     (comme dans Foodix). Toucher le fond sombre autour les ferme. -->
<section id="ecran-reglages" class="ecran modale" hidden>
  <div class="fenetre-c" role="dialog" aria-label="Réglages">
    <div class="fhd"><h2 class="titre">Réglages</h2>
      <button class="btn-icone" data-aller="accueil" aria-label="Fermer"><svg class="ic"><use href="icones/icones.svg#x"></use></svg></button></div>
    <div class="sect">Compte</div>
    <div class="groupe">
      <div class="reg"><span id="compte-info" class="resume"></span>
        <span class="synchro"><svg class="ic"><use href="icones/icones.svg#cloud-check"></use></svg><span class="synchro-texte">Synchronisé</span></span></div>
      <button class="reg" id="btn-deconnexion"><span>Se déconnecter</span><svg class="ic"><use href="icones/icones.svg#logout"></use></svg></button>
    </div>
    <div class="sect">Apparence</div>
    <div class="groupe">
      <div class="reg"><span>Style</span>
        <div id="choix-style" class="seg">
          <button data-style-choix="journal">Journal</button>
          <button data-style-choix="pioche">Pioche</button>
        </div>
      </div>
      <button class="reg" data-aller="theme"><span>Thème</span><span class="val"><span id="theme-actuel"></span><svg class="ic"><use href="icones/icones.svg#chevron-right"></use></svg></span></button>
      <div class="reg"><span>Animations</span>
        <div id="choix-animations" class="seg">
          <button data-anim-choix="completes">Complètes</button>
          <button data-anim-choix="simples">Simples</button>
        </div>
      </div>
      <button class="reg" data-aller="categories"><span>Catégories</span><span class="val"><span id="resume-categories" class="resume"></span><svg class="ic"><use href="icones/icones.svg#chevron-right"></use></svg></span></button>
    </div>
    <div class="sect">Excel</div>
    <div class="deux">
      <button class="btn" id="btn-export"><svg class="ic"><use href="icones/icones.svg#download"></use></svg>Exporter</button>
      <button class="btn" id="btn-import"><svg class="ic"><use href="icones/icones.svg#upload"></use></svg>Importer</button>
      <input type="file" id="fichier-import" accept=".xlsx" hidden>
    </div>
    <p class="version"><span id="version"></span></p>
  </div>
</section>

<section id="ecran-theme" class="ecran modale" hidden>
  <div class="fenetre-c" role="dialog" aria-label="Thème">
    <button class="retour" data-aller="accueil">‹ Réglages</button>
    <h2 class="titre">Thème</h2>
    <div id="choix-theme" class="groupe">
      <button class="reg" data-theme-choix="auto"><span>Auto</span><span class="radio"></span></button>
      <button class="reg" data-theme-choix="clair"><span>Clair</span><span class="radio"></span></button>
      <button class="reg" data-theme-choix="sombre"><span>Sombre</span><span class="radio"></span></button>
    </div>
  </div>
</section>

<section id="ecran-categories" class="ecran modale" hidden>
  <div class="fenetre-c" role="dialog" aria-label="Catégories">
    <button class="retour" data-aller="accueil">‹ Réglages</button>
    <h2 class="titre">Catégories</h2>
    <div id="liste-categories" class="groupe"></div>
    <button class="btn" id="btn-ajout-categorie"><svg class="ic"><use href="icones/icones.svg#plus"></use></svg>Ajouter</button>
  </div>
</section>

<!-- Fenêtres (fiche d'une astuce, formulaire) : remplies par app.js -->
<div id="voile" class="voile" hidden></div>

<!-- Petit message en bas de l'écran (avec « Annuler » après une suppression) -->
<div id="toast" class="toast" hidden>
  <span id="toast-texte"></span>
  <button id="toast-annuler">Annuler</button>
</div>

<script src="champs-mobile.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
